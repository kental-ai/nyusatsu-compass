# 自治体データの日次増分取得 → スナップショット更新をコミット（pushがNetlifyビルドを自動起動）。
# 対象は当年度のみ（過去分はバックフィル済みスナップショットに保持。公開保持期間が短いため
# 「取り続けること」自体がアーカイブ資産になる）。
name: daily-local-awards
on:
  schedule:
    - cron: '0 22 * * *'   # 22:00 UTC = 7:00 JST（秋田cals05の稼働時間は7:00〜24:00 JST。8:00の本ビルド前に完了させる）
  workflow_dispatch:
permissions:
  contents: write   # スナップショットのcommit/pushに必要（既定のGITHUB_TOKENは読み取りのみ）
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: スナップショット読込→当年度の増分取得→書き出し
        run: |
          node pipeline/snapshot_local.mjs import
          Y=$(TZ=Asia/Tokyo date +%Y)
          M=$(TZ=Asia/Tokyo date +%m)
          FY=$Y; if [ "$M" -lt 04 ]; then FY=$((Y-1)); fi
          # 1本のフェッチャが落ちてもスナップショット出力まで到達させる（各フェッチャはDBへ逐次書くので
          # 途中まで取れた分は残る）。08-26/27は大分ホストへの接続タイムアウトで日次が丸ごと失敗した
          node pipeline/fetch_supercals.mjs chiba $FY all || echo "::warning::chiba の取得に失敗（継続）"
          node pipeline/fetch_supercals.mjs shizuoka $FY all || echo "::warning::shizuoka の取得に失敗（継続）"
          node pipeline/fetch_supercals.mjs miyazaki $FY all || echo "::warning::miyazaki の取得に失敗（継続）"
          node pipeline/fetch_supercals.mjs ehime $FY all || echo "::warning::ehime の取得に失敗（継続）"
          # 富士通の共有ホスト勢（KikanNOはインスタンス定義の kikans を全テナント巡回）。平日6:00〜23:00 JSTのみ稼働
          node pipeline/fetch_supercals.mjs niigata $FY || echo "::warning::niigata の取得に失敗（継続）"
          node pipeline/fetch_supercals.mjs tochigi $FY || echo "::warning::tochigi の取得に失敗（継続）"
          node pipeline/fetch_supercals.mjs ishikawa $FY || echo "::warning::ishikawa の取得に失敗（継続）"
          node pipeline/fetch_supercals.mjs okinawa $FY || echo "::warning::okinawa の取得に失敗（継続）"
          node pipeline/fetch_supercals.mjs mie $FY || echo "::warning::mie の取得に失敗（継続）"
          node pipeline/fetch_akita.mjs $FY || echo "::warning::fetch_akita.mjs の取得に失敗（継続）"
          # かながわ（DENTYO系）は落札者名が詳細ページにしかなく1件1リクエスト。
          # 未取得分も毎日少しずつ埋まるよう上限つきで回す（残りは翌日以降に持ち越し）
          node pipeline/fetch_dentyo.mjs kanagawa $FY --max=1500 || echo "::warning::kanagawa の取得に失敗（継続）"
          # 大分（DENTYO旧型・東芝PPI）も落札者名が詳細ページにしかなく1件1リクエスト。
          # 当年度の未取得分を毎日少しずつ埋める（団体順に進み、既知行は詳細を取らずに飛ばす）
          node pipeline/fetch_dentyo_ppi.mjs oita $FY --max=1200 || echo "::warning::oita の取得に失敗（継続）"
          # 福岡（東芝PPIのP1020画面系）。年度全体だと一覧のページ送りだけで700リクエスト級になるので
          # 日次は入札日の直近30日だけを見る（既知行は詳細を取らずに飛ばす）
          node pipeline/fetch_dentyo_p1020.mjs fukuoka --days=30 --max=600 || echo "::warning::fukuoka の取得に失敗（継続）"
          # 広島市（PPI_P系・NEC）は一覧に落札者と金額が載るので当年度を丸ごと取り直しても21リクエストで済む
          node pipeline/fetch_ppi_p.mjs hiroshima $FY || echo "::warning::hiroshima の取得に失敗（継続）"
          # 京都（efftis系・同じPPI_P）。年度＋団体で検索する型で、当年度の21団体×2区分で約64リクエスト
          node pipeline/fetch_ppi_p.mjs kyoto $FY || echo "::warning::kyoto の取得に失敗（継続）"
          # 埼玉（電子入札コアシステム型）も落札者・金額が詳細ページにしかなく1件1リクエスト。
          # 一覧は開札日の降順なので、--percap を小さくして69機関に薄く回せば新着から自然に埋まる
          node pipeline/fetch_core_koukai.mjs saitama --from=$FY-04-01 --percap=6 --max=1400 || echo "::warning::saitama の取得に失敗（継続）"
          # 共有ASP epi-cloud（コアシステムの年度・日付区分世代）。一覧に落札者と金額が載るので安く、
          # 当年度だけなら1県あたり数十リクエストで済む。17srcで計約900リクエスト
          for S in aomori iwate miyagi yamagata fukushima shiga wakayama tottori yamaguchi saga nagasaki niigata_epi mie_epi kyoto_epi fukuoka_epi miyazaki_epi okinawa_epi; do
            node pipeline/fetch_epi_koukai.mjs $S --nendo=$FY --max=200 || echo "::warning::$S の取得に失敗（継続）"
          done
          node pipeline/snapshot_local.mjs export
          # KKJ公告のアーカイブ蓄積（直近7日の新着を取り込み、掲載期間が終わって消える前に保存する）
          node pipeline/archive_notices.mjs import
          node pipeline/fetch_kkj.mjs 7 || echo "::warning::fetch_kkj(7日窓)の取得に失敗（継続）"
          node pipeline/archive_notices.mjs absorb
          node pipeline/archive_notices.mjs export
      - name: スナップショットをコミット
        run: |
          git config user.name "hojokin-dev"
          git config user.email "hojokin-dev@users.noreply.github.com"
          # Netlifyの自動ビルドは抑止し、8:00の本ビルドに乗せる（1日1ビルド）
          MSG="自治体データ日次スナップショット更新 [skip netlify]"
          commit_snapshot() {
            git add data/snapshots/
            git diff --cached --quiet && return 1
            git commit -m "$MSG"
            return 0
          }
          commit_snapshot || { echo "変更なし"; exit 0; }
          # ジョブの実行中に人手のpushが入ると push が rejected になり、その日の取得が丸ごと落ちる
          # （2026-09-04に実際に発生）。リモートのスナップショットを取り込み直して作り直す。
          # import は INSERT OR IGNORE なので、双方の行を含む上位集合になり取りこぼさない
          for i in 1 2 3; do
            git push && exit 0
            echo "::warning::pushがrejected（$i回目）。リモートのスナップショットを取り込んで作り直す"
            git reset --hard HEAD~1
            git pull --rebase
            node pipeline/snapshot_local.mjs import
            node pipeline/snapshot_local.mjs export
            node pipeline/archive_notices.mjs import
            node pipeline/archive_notices.mjs export
            commit_snapshot || { echo "変更なし"; exit 0; }
          done
          echo "::error::スナップショットのpushに3回失敗した"
          exit 1
