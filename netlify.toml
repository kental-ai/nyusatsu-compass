# Netlify上でデータ取得→分類→静的生成まで実行する（hojokin-dbと同方式）。
# 日次の再ビルドは GitHub Actions (.github/workflows/daily.yml) がBuild hookを叩く。
[build]
  # 取得 → スナップショット取込 → 分類（awards/local_awards両方）→ 生成 → IndexNow通知。
  # 検品(tools/qa_dist.mjs)はビルド時間の15分上限を避けるためNetlifyから外し、push前にローカルで実行する運用。
  # IndexNowの失敗はデプロイを止めない（|| true）。
  command = "node pipeline/snapshot_geps.mjs import && node pipeline/fetch_geps.mjs recent && node pipeline/fetch_kkj.mjs 35 && node pipeline/snapshot_local.mjs import && node pipeline/archive_notices.mjs import && node pipeline/classify_rules.mjs && node site/build.mjs && (node pipeline/indexnow.mjs || true)"
  publish = "site/dist"

[build.environment]
  NODE_VERSION = "24"
  # build.mjsは全落札44万件+公告アーカイブをメモリに載せるため、V8既定ヒープでは不足する可能性がある
  NODE_OPTIONS = "--max-old-space-size=6144"

[functions]
  directory = "netlify/functions"
