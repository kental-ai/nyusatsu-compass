# Netlify上でデータ取得→分類→静的生成まで実行する（hojokin-dbと同方式）。
# 日次の再ビルドは GitHub Actions (.github/workflows/daily.yml) がBuild hookを叩く。
[build]
  # 取得 → スナップショット取込 → 分類（awards/local_awards両方）→ 生成 → IndexNow通知。
  # IndexNowの失敗はデプロイを止めない（|| true）。
  command = "node pipeline/fetch_geps.mjs all && node pipeline/fetch_kkj.mjs 35 && node pipeline/snapshot_local.mjs import && node pipeline/classify_rules.mjs && node site/build.mjs && (node pipeline/indexnow.mjs || true)"
  publish = "site/dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
